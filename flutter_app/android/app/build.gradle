plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveReleaseKeystoreFile = {
    def propStoreFile = keystoreProperties.getProperty("storeFile")?.trim()
    if (propStoreFile) {
        def candidate = file(propStoreFile)
        return candidate.exists() ? candidate : rootProject.file(propStoreFile)
    }
    return file("release.keystore")
}

def resolveReleaseStorePassword = {
    return System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
}

def resolveReleaseKeyAlias = {
    return System.getenv("KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias")
}

def resolveReleaseKeyPassword = {
    return System.getenv("KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword") ?: resolveReleaseStorePassword()
}

android {
    namespace = "com.example.personalmanagement"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.personalmanagement"
        minSdk = 26
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            def keystoreFile = resolveReleaseKeystoreFile()
            def resolvedStorePassword = resolveReleaseStorePassword()
            def resolvedKeyAlias = resolveReleaseKeyAlias()
            def resolvedKeyPassword = resolveReleaseKeyPassword()
            if (keystoreFile.exists() && resolvedStorePassword && resolvedKeyAlias && resolvedKeyPassword) {
                storeFile = keystoreFile
                storePassword = resolvedStorePassword
                keyAlias = resolvedKeyAlias
                keyPassword = resolvedKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            def keystoreFile = resolveReleaseKeystoreFile()
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseTaskRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (isReleaseTaskRequested) {
        def keystoreFile = resolveReleaseKeystoreFile()
        def resolvedStorePassword = resolveReleaseStorePassword()
        def resolvedKeyAlias = resolveReleaseKeyAlias()
        def resolvedKeyPassword = resolveReleaseKeyPassword()
        if (!keystoreFile.exists()) {
            throw new GradleException(
                "Missing release keystore at ${keystoreFile}! Production release builds cannot fall back to debug signing or generate an ephemeral key. Provide flutter_app/android/app/release.keystore (or flutter_app/android/key.properties) and configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD."
            )
        }
        if (!resolvedStorePassword || !resolvedKeyAlias || !resolvedKeyPassword) {
            throw new GradleException(
                "Incomplete release signing credentials! Ensure KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD (or flutter_app/android/key.properties) are set so release APKs use a consistent certificate."
            )
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

flutter {
    source = "../.."
}
