name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional integer Android versionCode override (must be >= pubspec.yaml build number)'
        required: false
        type: string
      build_name:
        description: 'Optional Android versionName override (defaults to pubspec.yaml version)'
        required: false
        type: string

jobs:
  test:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (Shared Foundation & Web Engine)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run Web & Shared Foundation Tests
        run: |
          npm install --legacy-peer-deps
          npm run check-foundation
          npm run check-architecture
          npm run check-migrations
          npm run check-ui
          npm test
          npm run lint

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Run Flutter Formatting, Analysis & Native Tests
        run: |
          cd flutter_app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  build-release:
    name: Build & Package Signed ARM64 Release APK
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository

          def redirectCentral = { MavenArtifactRepository repo ->
              def u = repo.url?.toString() ?: ""
              if (u.contains("repo.maven.apache.org/maven2") || u.contains("repo1.maven.org/maven2")) {
                  repo.url = "https://maven-central.storage-download.googleapis.com/maven2/"
              }
          }

          beforeSettings { settings ->
              settings.pluginManagement.repositories.withType(MavenArtifactRepository).configureEach(redirectCentral)
              settings.dependencyResolutionManagement.repositories.withType(MavenArtifactRepository).configureEach(redirectCentral)
          }

          allprojects {
              buildscript.repositories.withType(MavenArtifactRepository).configureEach(redirectCentral)
              repositories.withType(MavenArtifactRepository).configureEach(redirectCentral)
          }
          EOF

      - name: Set up Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Validate Release Version Configuration
        env:
          DISPATCH_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          DISPATCH_BUILD_NAME: ${{ github.event.inputs.build_name }}
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:[[:space:]]*' flutter_app/pubspec.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//')
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Invalid flutter_app/pubspec.yaml version '$PUBSPEC_VERSION'. Expected semantic version X.Y.Z+N with integer versionCode."
            exit 1
          fi
          PUBSPEC_NAME="${BASH_REMATCH[1]}"
          PUBSPEC_CODE="${BASH_REMATCH[2]}"
          if [ "$PUBSPEC_CODE" -lt 1 ]; then
            echo "::error::Invalid pubspec.yaml versionCode '$PUBSPEC_CODE'. Must be >= 1."
            exit 1
          fi

          EXPECTED_VERSION_NAME="${DISPATCH_BUILD_NAME:-$PUBSPEC_NAME}"
          EXPECTED_VERSION_CODE="${DISPATCH_BUILD_NUMBER:-$PUBSPEC_CODE}"

          if [[ ! "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$EXPECTED_VERSION_CODE" -lt "$PUBSPEC_CODE" ]; then
            echo "::error::Invalid build_number '$EXPECTED_VERSION_CODE'. Must be an integer >= pubspec.yaml versionCode ($PUBSPEC_CODE)."
            exit 1
          fi

          echo "=== Release Version Configuration ==="
          echo "  - pubspec.yaml version: $PUBSPEC_VERSION"
          echo "  - Effective versionName: $EXPECTED_VERSION_NAME"
          echo "  - Effective versionCode: $EXPECTED_VERSION_CODE"
          echo "EXPECTED_VERSION_NAME=$EXPECTED_VERSION_NAME" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_CODE=$EXPECTED_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Validate & Decode Persistent Release Keystore
        env:
          INPUT_SECRET_B64: ${{ secrets.KEYSTORE_BASE64 }}
          INPUT_SECRET_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_SECRET_KEYPASS: ${{ secrets.KEY_PASSWORD }}
          INPUT_VAR_B64: ${{ vars.KEYSTORE_BASE64 }}
          INPUT_VAR_PASS: ${{ vars.KEYSTORE_PASSWORD }}
          INPUT_VAR_ALIAS: ${{ vars.KEY_ALIAS }}
          INPUT_VAR_KEYPASS: ${{ vars.KEY_PASSWORD }}
          INPUT_LOWER_B64: ${{ secrets.keystore_base64 }}
          INPUT_LOWER_PASS: ${{ secrets.keystore_password }}
          INPUT_LOWER_ALIAS: ${{ secrets.key_alias }}
          INPUT_LOWER_KEYPASS: ${{ secrets.key_password }}
        run: |
          # Multi-source resolution in Bash to support Secrets or Variables without boolean coercion
          KEYSTORE_BASE64="${INPUT_SECRET_B64:-${INPUT_VAR_B64:-$INPUT_LOWER_B64}}"
          KEYSTORE_PASSWORD="${INPUT_SECRET_PASS:-${INPUT_VAR_PASS:-$INPUT_LOWER_PASS}}"
          KEY_ALIAS="${INPUT_SECRET_ALIAS:-${INPUT_VAR_ALIAS:-$INPUT_LOWER_ALIAS}}"
          KEY_PASSWORD="${INPUT_SECRET_KEYPASS:-${INPUT_VAR_KEYPASS:-${INPUT_LOWER_KEYPASS:-$KEYSTORE_PASSWORD}}}"

          [ -n "$KEYSTORE_PASSWORD" ] && echo "::add-mask::$KEYSTORE_PASSWORD" || true
          [ -n "$KEY_PASSWORD" ] && echo "::add-mask::$KEY_PASSWORD" || true

          echo "=== Signing Configuration Diagnostic ==="
          [ -n "$KEYSTORE_BASE64" ] && echo "  - KEYSTORE_BASE64: [RESOLVED (${#KEYSTORE_BASE64} bytes)]" || echo "  - KEYSTORE_BASE64: [MISSING]"
          [ -n "$KEYSTORE_PASSWORD" ] && echo "  - KEYSTORE_PASSWORD: [RESOLVED]" || echo "  - KEYSTORE_PASSWORD: [MISSING]"
          [ -n "$KEY_ALIAS" ] && echo "  - KEY_ALIAS: [RESOLVED ($KEY_ALIAS)]" || echo "  - KEY_ALIAS: [MISSING]"
          [ -n "$KEY_PASSWORD" ] && echo "  - KEY_PASSWORD: [RESOLVED]" || echo "  - KEY_PASSWORD: [MISSING]"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing persistent release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and optional KEY_PASSWORD). Ephemeral CI key generation is disabled because rotating certificates causes Android INSTALL_FAILED_UPDATE_INCOMPATIBLE ('App not installed') on existing devices. Upload your existing release keystore to GitHub Repository Secrets before building a release APK."
            exit 1
          fi

          mkdir -p flutter_app/android/app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > flutter_app/android/app/release.keystore
          if [ ! -s flutter_app/android/app/release.keystore ]; then
            echo "::error::Keystore decode failed or resulting release.keystore file is empty."
            exit 1
          fi

          if ! keytool -list -keystore flutter_app/android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded release.keystore failed validation against KEY_ALIAS='$KEY_ALIAS' and KEYSTORE_PASSWORD."
            rm -f flutter_app/android/app/release.keystore
            exit 1
          fi
          echo "Successfully decoded and verified persistent release keystore (alias: $KEY_ALIAS)"

          # Export credentials to GITHUB_ENV for the Gradle build step
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Standalone ARM64-v8a Production Release APK
        run: |
          cd flutter_app
          rm -rf android/.gradle
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --target-platform android-arm64 --build-name="$EXPECTED_VERSION_NAME" --build-number="$EXPECTED_VERSION_CODE"

      - name: Verify APK Metadata, Completeness & Signing Certificate
        run: |
          cd flutter_app
          APK_DIR="build/app/outputs/flutter-apk"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_DIR/app-arm64-v8a-release.apk"
          fi

          APK_FILE="$APK_DIR/app-arm64-v8a-release.apk"
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Expected production APK missing or empty: $APK_FILE"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          echo "=== 1. Package File & Completeness Details ==="
          ls -lh "$APK_FILE"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "SHA-256 Checksum: $APK_SHA256"

          APK_ENTRIES=$(unzip -Z1 "$APK_FILE")
          for required_entry in "AndroidManifest.xml" "classes.dex" "resources.arsc"; do
            if ! echo "$APK_ENTRIES" | grep -qx "$required_entry"; then
              echo "::error::APK is incomplete (missing $required_entry)"
              exit 1
            fi
          done

          echo "=== 2. Architecture & Native Libraries (ARM64-v8a only) ==="
          LIB_ENTRIES=$(echo "$APK_ENTRIES" | grep "^lib/" || true)
          echo "$LIB_ENTRIES"
          if ! echo "$LIB_ENTRIES" | grep -q "^lib/arm64-v8a/"; then
            echo "::error::Standalone ARM64 release APK is missing lib/arm64-v8a/ native libraries."
            exit 1
          fi

          echo "=== 3. Manifest & Version Verification (aapt2) ==="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 tool not found in ANDROID_HOME/build-tools"
            exit 1
          fi
          BADGING=$("$AAPT2" dump badging "$APK_FILE")
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|minSdkVersion:|targetSdkVersion:|application-debuggable|native-code:)" || true

          if ! echo "$BADGING" | grep -q "package: name='com.example.personalmanagement' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"; then
            echo "::error::APK package or version mismatch! Expected com.example.personalmanagement versionCode=$EXPECTED_VERSION_CODE versionName=$EXPECTED_VERSION_NAME"
            exit 1
          fi

          # Older aapt2 prints sdkVersion:'26', while newer AOSP build-tools (e.g. 36+) print minSdkVersion:'26'.
          if ! echo "$BADGING" | grep -qE "(^|[^[:alnum:]_])(sdkVersion|minSdkVersion):'26'"; then
            if echo "$BADGING" | grep -qE "(^|[^[:alnum:]_])(sdkVersion|minSdkVersion):"; then
              echo "::error::Unexpected minSdkVersion (expected 26)"
              echo "$BADGING" | grep -E "(^|[^[:alnum:]_])(sdkVersion|minSdkVersion):" || true
              exit 1
            fi
            USES_SDK_XML=$("$AAPT2" dump xmltree "$APK_FILE" --file AndroidManifest.xml | grep -A4 -E "uses-sdk" || true)
            echo "$USES_SDK_XML"
            if ! echo "$USES_SDK_XML" | grep -qE "minSdkVersion(\([^)]*\))?=(\(type 0x10\)[[:space:]]*)?0x0*1a([^[:xdigit:]]|$)|minSdkVersion(\([^)]*\))?=26([^0-9]|$)"; then
              echo "::error::Unexpected minSdkVersion (expected 26)"
              exit 1
            fi
          fi
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Release APK must NOT have android:debuggable='true'!"
            exit 1
          fi

          echo "=== 4. apksigner Verification ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in ANDROID_HOME/build-tools"
            exit 1
          fi
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -qiE "CN=Android Debug|CN=Daywell CI Release"; then
            echo "::error::Release APK was signed with a debug or ephemeral CI certificate! Aborting."
            exit 1
          fi

          CERT_SHA256=$(echo "$CERT_OUTPUT" | grep -m 1 "Signer #1 certificate SHA-256 digest:" | awk -F': ' '{print $2}')
          CERT_DN=$(echo "$CERT_OUTPUT" | grep -m 1 "Signer #1 certificate DN:" | awk -F': ' '{print $2}')

          {
            echo "### Daywell Release APK Verification"
            echo "- **Application ID:** \`com.example.personalmanagement\`"
            echo "- **Version:** \`$EXPECTED_VERSION_NAME\` (\`versionCode: $EXPECTED_VERSION_CODE\`)"
            echo "- **Min / Target SDK:** \`26\` / \`34\`"
            echo "- **APK SHA-256:** \`$APK_SHA256\`"
            echo "- **Signer DN:** \`$CERT_DN\`"
            echo "- **Signer Certificate SHA-256:** \`$CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Decoded Keystore Material
        if: always()
        run: rm -f flutter_app/android/app/release.keystore

      - name: Prune Previous APK Artifacts (Best-Effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_IDS=$(gh api \
            --paginate \
            "repos/${{ github.repository }}/actions/artifacts?name=daywell-arm64-v8a-release-apk&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' || true)
          for id in $ARTIFACT_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Production Release APK (ARM64-v8a)
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: daywell-arm64-v8a-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Fallback Upload to GitHub Pre-Release (Bypasses Artifact Quota)
        if: steps.upload_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE="flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          SHA_FILE="flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256"
          sha256sum "$APK_FILE" > "$SHA_FILE"
          TAG="ci-latest-apk"
          NOTES="Signed ARM64 release APK for commit ${{ github.sha }} (published to GitHub Pre-Release because Actions artifact storage quota was hit)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --target "${{ github.sha }}" \
              --prerelease \
              --latest=false \
              --title "Daywell CI Latest ARM64 APK" \
              --notes "$NOTES"
          fi
